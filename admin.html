<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMRoomFaultReporter | Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="https://digos.umindanao.edu.ph/" target="_blank">
                <img src="img/um-logo.png" alt="UM Logo" class="um-logo-img">
            </a>
            <div class="system-title">
                <h1>UMRoomFaultReporter</h1>
                <p>Maintenance Management System</p>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="home-btn" aria-label="Home">
                <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg>
            </a>
            <button class="menu-btn" id="menuToggle">☰</button>
        </div>
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html" target="_blank">View Public Site</a>
            <a href="#" id="logoutBtnMenu" style="color:#B00020; font-weight:600;">Logout</a>
        </div>
    </header>

    <main class="admin-container">
        <div class="admin-header-row">
            <h2>Admin Dashboard</h2>
            <button id="logoutBtn" class="logout-btn">Log Out</button>
        </div>

        <div id="adminSections">
            <p style="text-align:center; color: var(--text-muted); font-style: italic;">Loading reports from database...</p>
        </div>
    </main>

    <!-- SUPABASE & SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
